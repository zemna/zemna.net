# ============================================================================
# zemnanet — Hugo site config
# zemna.net — Bridging Korean & Southeast Asian Tech
# ============================================================================

baseURL = "https://zemna.net/"
languageCode = "en-us"
title = "zemnanet"
theme = "zemnanet-theme"
summaryLength = 35


# Site metadata (used by templates & social cards)
[params]
  author = "Shinjae Kang"
  authorLocation = "Jakarta, Indonesia"
  authorRole = "Programmer & Software Architect"
  authorAvatar = "/img/shinjae-kang-avatar.jpg"
  authorBio = "Programmer and software architect in Indonesia. Laravel/Vue SaaS projects, PHP, DevOps, .NET, C#, WPF, VB, HTML, CSS, WordPress, Flutter, and AI-assisted engineering workflows."
  description = "Practical software notes from a Korean programmer and software architect in Indonesia — Laravel/Vue SaaS projects, DevOps, AI agents, and the Korea to Southeast Asia tech bridge."
  tagline = "Practical software systems from Indonesia"
  email = "zemna@zemna.net"
  twitter = "@zemnanet"
  instagram = "@zemna"
  threads = "@zemna"
  tiktok = "@zemnanet"
  github = "zemna"
  linkedin = "zemnanet"
  googleAnalytics = "G-R2K1JJ9QJH"
  ahrefsAnalytics = "7luiR38wygxv7nEKxAYJrw"
  microsoftClarity = "xhm9nacg77"
  timezone = "Asia/Jakarta"
  copyrightYear = 2026

  # Design system version (link to /design-system/)
  designSystemVersion = "1.0.0"

  # Code highlight
  codeCopyButton = true
  codeMaxLines = 50

  # SEO defaults
  openGraphType = "website"
  twitterCard = "summary_large_image"

  # Reading time
  readingTime = true

  # Show last modified date
  showLastModified = true

  # Use serif font for editorial Korean
  useSerifForEditorial = true

  # Social share (post footer)
  shareButtons = ["twitter", "linkedin", "copy"]

# Main menu (header)
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 10

[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 20

[[menu.main]]
  name = "Topics"
  url = "/topics/"
  weight = 25

[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 28

[[menu.main]]
  name = "Portfolio"
  url = "/portfolio/"
  weight = 29

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 30

# Footer menu
[[menu.footer]]
  name = "Start Here"
  url = "/start-here/"
  weight = 5

[[menu.footer]]
  name = "Uses"
  url = "/uses/"
  weight = 8

[[menu.footer]]
  name = "RSS"
  url = "/index.xml"
  weight = 10

[[menu.footer]]
  name = "Sitemap"
  url = "/sitemap.xml"
  weight = 20

[[menu.footer]]
  name = "Design System"
  url = "/design-system/"
  weight = 30

[[menu.footer]]
  name = "Colophon"
  url = "/colophon/"
  weight = 40

# Series taxonomy
[taxonomies]
  topic = "topics"
  tag = "tags"
  series = "series"

# Output formats: RSS, JSON feed, sitemap
[outputFormats]
  [outputFormats.RSS]
    mediatype = "application/rss+xml"
    baseName = "index"
    isPlainText = true
    notAlternative = true
  [outputFormats.JSON]
    mediatype = "application/json"
    baseName = "index"
    isPlainText = true
    isHTML = false

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

# Markdown rendering
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = false
    noClasses = false
    style = "monokai"
    tabWidth = 2

# Related content: weight shared topics/tags/series higher than recency
[related]
  threshold = 20
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "topics"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "series"
    weight = 70
  [[related.indices]]
    name = "keywords"
    weight = 40
  [[related.indices]]
    name = "date"
    weight = 10

# Sitemap
[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# Pagination
[pagination]
  pagerSize = 10

# Privacy / security
[privacy]
  [privacy.vimeo]
    disabled = false
    simple = true
  [privacy.youtube]
    disabled = false
    privacyEnhanced = true
  [privacy.x]
    disabled = false
    enableDNT = true

# Permalinks: clean URLs
[permalinks]
  posts = "/blog/:slug/"
  series = "/series/:slug/"

# Build stats
[buildStats]
  disable = false

# Module mounts (will be used later for content import from external)
[[module.mounts]]
  source = "content"
  target = "content"

[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[[module.mounts]]
  source = "data"
  target = "data"

[[module.mounts]]
  source = "assets"
  target = "assets"
