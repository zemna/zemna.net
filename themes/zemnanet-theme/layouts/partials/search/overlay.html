{{- /*
  search-overlay.html — Full-screen search modal. Triggered by [data-action="search"].
  Reads /index.json for client-side full-text filter (no Pagefind runtime).
*/ -}}
<div id="zn-search-overlay" class="zn-search" role="dialog" aria-modal="true" aria-label="Search zemnanet">
  <div class="zn-search__panel">
    <div class="zn-search__head">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="search" placeholder="Search posts, tags, or topics…" autocomplete="off" spellcheck="false">
      <button type="button" class="zn-search__close" data-action="search-close" aria-label="Close search">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="zn-search__results" data-search-results>
      <p class="zn-search__empty">Type at least 2 characters to search.</p>
    </div>
    <div class="zn-search__foot">
      <span><kbd>Esc</kbd> to close</span>
      <span><kbd>⌘K</kbd> to open</span>
    </div>
  </div>
</div>
