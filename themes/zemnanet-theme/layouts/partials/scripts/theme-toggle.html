{{- /*
  scripts/theme-toggle.html — vanilla JS theme + reading progress
*/ -}}
<script>
(function() {
  var root = document.documentElement;
  var stored = localStorage.getItem('zn-theme');
  var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  var theme = stored || system;
  root.setAttribute('data-theme', theme);

  document.addEventListener('click', function(e) {
    var btn = e.target.closest('[data-action="theme"]');
    if (!btn) return;
    var current = root.getAttribute('data-theme') || 'light';
    var next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('zn-theme', next);
  });

  // Reading progress bar (article pages)
  var progress = document.querySelector('[data-reading-progress]');
  if (progress) {
    var update = function() {
      var article = document.querySelector('article');
      if (!article) return;
      var rect = article.getBoundingClientRect();
      var total = article.offsetHeight - window.innerHeight;
      var scrolled = -rect.top;
      var pct = Math.max(0, Math.min(100, (scrolled / total) * 100));
      progress.style.width = pct + '%';
    };
    window.addEventListener('scroll', update, { passive: true });
    update();
  }
})();
</script>
